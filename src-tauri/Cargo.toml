[package]
name = "galeon"
version = "1.0.0-alpha.3"
description = "Galeon Object Storage Client"
authors = ["Hanafee Hama"]
license = "MIT"
repository = "https://github.com/fiztoz/galeon"
edition = "2021"
rust-version = "1.94.1"

[lib]
name = "galeon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
opendal = { version = "0.59", features = ["services-s3", "executors-tokio", "layers-throttle"] }
ssh2 = { version = "0.9", features = ["vendored-openssl"] }
suppaftp = { version = "^11.0.0", features = ["native-tls"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
futures-util = "0.3"
chrono = { version = "0.4", features = ["serde"] }
glob = "0.3"
lazy_static = "1.5.0"
md5 = "0.8"
dirs = "5.0"
notify = "8.2.0"
aws-config = "1.12.0"
aws-credential-types = "1"
# 1.145+ uses patched lru; `rustls` would re-enable the legacy Hyper 0.14 stack.
aws-sdk-s3 = { version = "1.145.0", default-features = false, features = ["sigv4a", "http-1x", "default-https-client", "rt-tokio"] }
# Public Smithy HTTP traits used by the explicit metadata TLS-bypass adapter.
aws-smithy-runtime-api = { version = "1", features = ["client", "http-1x"] }
aws-smithy-types = { version = "1", features = ["http-body-1-x"] }
urlencoding = "2"
# Match opendal-http-transport-reqwest's reqwest major so the custom TLS-bypass
# client converts into ReqwestTransport without a second HTTP stack.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "stream", "charset"] }
opendal-http-transport-reqwest = "0.59"

# keyring enables exactly one native credential store per OS. Unconditionally
# listing apple-native + sync-secret-service would drop Linux's dbus stack into
# Windows builds and leave Windows with no store (keyring then falls back to its
# in-memory mock, so saved credentials would silently vanish between runs).
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }

[dev-dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = "0.13"
tauri = { version = "2", features = ["test"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
