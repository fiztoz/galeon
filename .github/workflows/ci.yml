name: CI

# Gates the repo on the checks that actually catch regressions here:
# formatting, types, clippy, secret scanning, and Rust unit + transfer-integrity
# tests against MinIO.
#
# macOS is the shipping target (docs/RELEASE_MACOS.md), so the Rust suite runs on
# both: Linux carries the MinIO e2e tier, macOS proves the ship build compiles and
# its unit/keyring tests hold. Unit coverage on both means a Linux-only break in
# them cannot slip through.
#
# The e2e tier reuses scripts/dev-minio.sh rather than re-declaring a MinIO
# service here, so CI and a local run can never drift apart on endpoint, bucket,
# or credentials. Those values are dev-only and hardcoded by integrity_e2e.rs.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (fmt + types)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run --bun tsc --noEmit

      - name: Release tooling regression tests
        run: python3 -m unittest discover -s tests/release -v

  backend-linux:
    name: Rust suite (Linux + MinIO e2e)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Tauri v2 on Linux links against webkit2gtk/gtk; needed to compile the lib.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -o Acquire::Retries=3 -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Start and seed the local MinIO loop
        run: |
          ./scripts/dev-minio.sh up
          ./scripts/dev-minio.sh seed
          ./scripts/dev-minio.sh status

      - name: Clippy (deny warnings)
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --lib --tests -- -D warnings

      - name: Cargo test (full suite, incl. integrity e2e)
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib

      - name: Stop MinIO
        if: always()
        run: ./scripts/dev-minio.sh down

  backend-macos:
    name: Rust suite (macOS)
    runs-on: macos-latest
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Cargo test (unit tier; MinIO e2e runs on Linux)
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib -- --skip integrity_e2e

  backend-windows:
    name: Rust suite (Windows)
    runs-on: windows-latest
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      # ssh2/sftp use vendored-openssl, which compiles OpenSSL from source on
      # Windows and needs Perl; windows-latest ships Strawberry Perl.
      - name: Diagnose entrypoint failure (temporary)
        shell: pwsh
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib --no-run
          $vs = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vs -latest -products * -find "VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          Write-Host "dumpbin: $dumpbin"
          $exe = Get-ChildItem -Recurse "src-tauri\target\debug\deps\galeon_lib-*.exe" | Select-Object -First 1
          Write-Host "exe: $($exe.FullName)"
          & $dumpbin /DEPENDENTS $exe.FullName

  secrets:
    name: Secret scan (history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install checksum-pinned Gitleaks
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  '"$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan all fetched history (redacted; no reports uploaded)
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts="--all"'

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Frontend regression tests
        run: bun run test:frontend

      - name: Build
        run: bun run build
