name: Dependency security

# Recurring advisory review, separate from deterministic PR checks. Findings fail
# visibly; do not hide transitive/upstream advisories with blanket ignore lists.
on:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-advisories:
    name: RustSec advisory audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - name: Install pinned auditor
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Audit every locked target (including upstream findings)
        run: cargo audit --file src-tauri/Cargo.lock

  javascript-advisories:
    name: JavaScript advisory audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun audit
