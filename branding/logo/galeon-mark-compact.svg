<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="sail" x1="34" y1="12" x2="50" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#0E7490"/>
    </linearGradient>
  </defs>
  <!-- Compact mark: mast + single sail + pennant + hull -->
  <!-- Optimized for 32-64px: drops jib sail and gale strokes for clarity -->
  <g>
    <!-- gale strokes (simplified to 2) -->
    <line x1="6" y1="22" x2="18" y2="22" stroke="#F5A524" stroke-width="3" stroke-linecap="round"/>
    <line x1="4" y1="30" x2="16" y2="30" stroke="#F5A524" stroke-width="3" stroke-linecap="round"/>
    <!-- main sail only -->
    <path d="M34 12 C46 16 52 32 52 44 L34 44 Z" fill="url(#sail)"/>
    <!-- mast -->
    <rect x="32" y="6" width="3" height="42" rx="1.5" fill="#0C2233"/>
    <!-- pennant -->
    <path d="M35 6 L45 10 L35 14 Z" fill="#F5A524"/>
    <!-- hull -->
    <path d="M14 48 L54 48 C52 54 48 58 44 58 L22 58 C18 58 14 54 14 48 Z" fill="#0C2233"/>
  </g>
</svg>
